<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phoneme Test 1 | Lis n Bliss</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17212f;
        --muted: #617084;
        --line: #d9e1ea;
        --soft: #f5f8fb;
        --panel: #ffffff;
        --brand: #146c63;
        --brand-dark: #0d4f49;
        --success: #157347;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(120deg, rgba(20, 108, 99, 0.08), transparent 36%),
          linear-gradient(300deg, rgba(217, 119, 6, 0.09), transparent 32%),
          var(--soft);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font: inherit;
      }

      .shell {
        width: min(920px, calc(100% - 40px));
        margin: 0 auto;
        padding-bottom: 44px;
      }

      header {
        padding: 24px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        color: #fff;
        background: var(--brand);
        box-shadow: 0 10px 24px rgba(20, 108, 99, 0.22);
      }

      .nav-link,
      .primary-btn {
        min-height: 42px;
        padding: 10px 16px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
      }

      .nav-link {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.72);
      }

      .primary-btn {
        border: 1px solid var(--brand);
        color: #fff;
        background: var(--brand);
        cursor: pointer;
      }

      .primary-btn:hover {
        background: var(--brand-dark);
      }

      .test-panel,
      .feedback-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 16px 46px rgba(24, 33, 47, 0.08);
      }

      .test-panel {
        padding: clamp(20px, 4vw, 34px);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--brand-dark);
        font-size: 13px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 5vw, 52px);
        line-height: 1;
      }

      .prompt {
        margin: 28px 0 14px;
        font-size: 18px;
        font-weight: 800;
      }

      .audio-zone {
        margin-top: 26px;
        padding: 18px;
        border: 1px solid rgba(20, 108, 99, 0.18);
        border-radius: 8px;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 16px;
        align-items: center;
        background: #f3fbf9;
      }

      .icon-btn {
        width: 52px;
        height: 52px;
        border: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #fff;
        background: var(--brand);
        cursor: pointer;
      }

      .wave {
        height: 42px;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .wave span {
        width: 7px;
        border-radius: 999px;
        background: rgba(20, 108, 99, 0.62);
      }

      .wave span:nth-child(1) {
        height: 16px;
      }

      .wave span:nth-child(2) {
        height: 30px;
      }

      .wave span:nth-child(3) {
        height: 22px;
      }

      .wave span:nth-child(4) {
        height: 38px;
      }

      .answer-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .answer {
        min-height: 66px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        text-align: left;
      }

      .answer strong,
      .answer span,
      .feedback-panel strong,
      .feedback-panel span {
        display: block;
      }

      .answer span,
      .feedback-panel span {
        margin-top: 4px;
        color: var(--muted);
        font-size: 14px;
      }

      .answer.correct {
        border-color: rgba(21, 115, 71, 0.45);
        background: #effaf3;
      }

      .answer.wrong {
        border-color: rgba(180, 35, 24, 0.45);
        background: #fff1ef;
      }

      .feedback-panel {
        margin-top: 18px;
        padding: 16px;
      }

      @media (max-width: 640px) {
        .shell {
          width: min(100% - 28px, 920px);
        }

        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .answer-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <a class="brand" href="../../index.html" aria-label="Lis n Bliss home">
          <span class="brand-mark" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path
                d="M5 10v4M9 7v10M13 4v16M17 8v8M21 11v2"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <span>Lis n Bliss</span>
        </a>

        <a class="nav-link" href="../../phoneme.html">Back to tests</a>
      </header>

      <main class="test-panel" aria-label="Phoneme test question">
        <p class="eyebrow" id="levelLabel">Easy level - Test 1</p>
        <h1 id="testTitle">Choose the word you hear.</h1>

        <div class="audio-zone">
          <button class="icon-btn" type="button" aria-label="Play audio">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M8 5v14l11-7L8 5Z" fill="currentColor" />
            </svg>
          </button>
          <div class="wave" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
        </div>

        <div class="prompt" id="promptText">Audio: single word with /i:/ or /I/</div>

        <div class="answer-grid" id="answerGrid"></div>

        <div class="feedback-panel" aria-live="polite">
          <strong id="feedbackTitle">Ready to answer</strong>
          <span id="feedbackText">Play the audio, then choose the option you hear.</span>
        </div>
      </main>
    </div>

    <script>
      const tests = {
        easy: {
          label: "Easy level - Test 1",
          title: "Choose the word you hear.",
          prompt: "Audio: single word with /i:/ or /I/",
          feedback: "Play the audio, then choose the option you hear.",
          answers: [
            ["sheep", "/sh-ee-p/", "correct"],
            ["ship", "/sh-i-p/", "wrong"],
            ["cheap", "/ch-ee-p/", "wrong"],
            ["chip", "/ch-i-p/", "wrong"],
          ],
        },
        medium: {
          label: "Medium level - Test 1",
          title: "Identify the word in the sentence.",
          prompt: "Audio: The manager said the file was saved.",
          feedback: "Choose the word that matches the sentence audio.",
          answers: [
            ["save", "present verb", "wrong"],
            ["saved", "past form", "correct"],
            ["safe", "adjective", "wrong"],
            ["safed", "not standard", "wrong"],
          ],
        },
        hard: {
          label: "Hard level - Test 1",
          title: "Find the sound difference in the dialogue.",
          prompt: "Audio: short dialogue with fast connected speech",
          feedback: "Choose the changed sound you hear.",
          answers: [
            ["/i/ vs /ee/", "bit and beat", "correct"],
            ["/ae/ vs /e/", "bad and bed", "wrong"],
            ["/p/ vs /b/", "pat and bat", "wrong"],
            ["/s/ vs /sh/", "sip and ship", "wrong"],
          ],
        },
      };

      const params = new URLSearchParams(window.location.search);
      const level = tests[params.get("level")] ? params.get("level") : "easy";
      const test = tests[level];
      const answerGrid = document.querySelector("#answerGrid");
      const feedbackTitle = document.querySelector("#feedbackTitle");
      const feedbackText = document.querySelector("#feedbackText");

      document.querySelector("#levelLabel").textContent = test.label;
      document.querySelector("#testTitle").textContent = test.title;
      document.querySelector("#promptText").textContent = test.prompt;
      feedbackText.textContent = test.feedback;

      test.answers.forEach(([label, meta, result]) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.dataset.result = result;
        button.innerHTML = `<strong>${label}</strong><span>${meta}</span>`;
        answerGrid.appendChild(button);
      });

      answerGrid.addEventListener("click", (event) => {
        const button = event.target.closest(".answer");
        if (!button) return;

        document.querySelectorAll(".answer").forEach((item) => {
          item.classList.remove("correct", "wrong");
        });

        if (button.dataset.result === "correct") {
          button.classList.add("correct");
          feedbackTitle.textContent = "Correct";
          feedbackText.textContent = "That answer matches the audio.";
        } else {
          button.classList.add("wrong");
          feedbackTitle.textContent = "Try again";
          feedbackText.textContent = "Listen again and focus on the target sound.";
        }
      });
    </script>
  </body>
</html>
